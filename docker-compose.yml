version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: serveflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-serveflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serveflow}
      POSTGRES_DB: ${POSTGRES_DB:-serveflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serveflow} -d ${POSTGRES_DB:-serveflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - serveflow

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: serveflow-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE}
      CORS_ORIGIN: ${CORS_ORIGIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SUPER_ADMIN_REGISTRATION_CODE: ${SUPER_ADMIN_REGISTRATION_CODE}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - serveflow

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: serveflow-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${BACKEND_URL}
    depends_on:
      - api
    networks:
      - serveflow

networks:
  serveflow:
    driver: bridge

volumes:
  postgres_data:
